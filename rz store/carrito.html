<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.jpg">
    <title>Carrito rz store</title>

    <style>
        :root {
            --negro-fondo: #0a050d;
            --blanco: #ffffff;
            --rojo-neon: #ff2a00;
            --verde-comprar: #25d366;
            --rojo-vaciar: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--negro-fondo);
            background-image: linear-gradient(rgba(10, 5, 13, 0.85), rgba(10, 5, 13, 0.85)), 
                              url('https://thumbs.dreamstime.com/b/dark-bronze-metallic-texture-flowing-ripples-deep-shadow-stylish-reflection-flow-d-rendering-holographic-abstract-186902955.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--blanco);
            overflow-x: hidden;
            padding: 40px 20px 100px;
        }

        .contenedor { 
            max-width: 650px; 
            margin: 0 auto; 
            background: rgba(43, 43, 43, 0.95); 
            padding: 25px; 
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        .item-carrito { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            padding: 15px 0; 
            border-bottom: 1px solid #444; 
        }

        .img-item {
            width: 70px;
            height: 85px;
            object-fit: cover;
            border-radius: 6px;
            background: #1a1a1a;
            border: 1px solid #555;
        }

        .info-item { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            flex: 1;
        }

        .info-item strong {
            font-size: 16px;
        }

        .badge-info { 
            font-size: 13px; 
            color: #ccc; 
            line-height: 1.4;
        }

        .precio-item {
            font-size: 16px;
            font-weight: 700;
            color: #a3ffeb;
        }

        .total { 
            font-size: 1.4em; 
            font-weight: bold; 
            margin-top: 25px; 
            text-align: right; 
            border-top: 2px solid #555;
            padding-top: 15px;
        }

        .acciones {
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .btn { 
            flex: 1;
            min-width: 140px;
            padding: 12px 18px; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            border: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-volver { background: #555; }
        .btn-vaciar { background: var(--rojo-vaciar); }
        .btn-comprar { 
            background: var(--verde-comprar); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #000;
        }

        @media (max-width: 768px) {
            body { padding: 15px 10px; font-size: 14px; }
            .contenedor { padding: 15px; }
            .item-carrito { gap: 10px; }
            .img-item { width: 60px; height: 75px; }
            .acciones { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Tu Carrito🛒</h1>
    
    <div id="lista-productos"></div>
    
    <div class="total" id="precio-total">Total: $0</div>
    
    <div class="acciones">
        <a href="inicio.html" class="btn btn-volver">← Seguir Comprando</a>
        <button onclick="limpiarCarrito()" class="btn btn-vaciar">Vaciar Carrito</button>
        <button onclick="comprarPorWhatsApp()" class="btn btn-comprar">Comprar por WhatsApp →</button>
    </div>
</div>

<script>
    const NUMERO_WHATSAPP = "573232470919"; 

    function mostrarCarrito() {
        let carrito = JSON.parse(localStorage.getItem('miCarrito')) || JSON.parse(localStorage.getItem('carrito')) || [];
        let contenedor = document.getElementById('lista-productos');
        let totalElemento = document.getElementById('precio-total');
        
        contenedor.innerHTML = ""; 
        let sumaTotal = 0;
        
        if (carrito.length === 0) {
            contenedor.innerHTML = "<p style='text-align:center; padding: 20px 0; color: #bbb;'>No has agregado ningún producto todavía.</p>";
            totalElemento.innerText = "Total: $0";
            return;
        }
        
        carrito.forEach(item => {
            const precioUnitario = parseFloat(item.precio) || 0;
            const cantidad = parseInt(item.cantidad) || 1;
            const subtotal = precioUnitario * cantidad;
            sumaTotal += subtotal;

            const imagenSrc = item.imagen ? item.imagen : 'sudadera 1.jpg';
            const colorTexto = item.color ? item.color : 'No especificado';
            const tallaTexto = item.talla ? item.talla : 'Única';
            const nombreTexto = item.nombre || item.titulo || 'Producto';

            contenedor.innerHTML += `
                <div class="item-carrito">
                    <img src="${imagenSrc}" alt="${nombreTexto}" class="img-item">
                    <div class="info-item">
                        <strong>${nombreTexto}</strong>
                        <span class="badge-info">
                            <b>Color:</b> ${colorTexto}<br>
                            <b>Talla:</b> ${tallaTexto} | <b>Cant:</b> ${cantidad}
                        </span>
                    </div>
                    <span class="precio-item">$${subtotal.toLocaleString('es-CO')}</span>
                </div>
            `;
        });
        
        totalElemento.innerText = `Total: $${sumaTotal.toLocaleString('es-CO')}`;
    }

    function limpiarCarrito() {
        localStorage.removeItem('miCarrito');
        localStorage.removeItem('carrito');
        mostrarCarrito();
    }

    function comprarPorWhatsApp() {
        let carrito = JSON.parse(localStorage.getItem('miCarrito')) || JSON.parse(localStorage.getItem('carrito')) || [];

        if (carrito.length === 0) {
            alert('Tu carrito está vacío. Agrega productos antes de comprar.');
            return;
        }

        let mensaje = "Hola, me gustaría realizar el siguiente pedido:\n\n";
        let totalAcumulado = 0;

        carrito.forEach(item => {
            const precioUnitario = parseFloat(item.precio) || 0;
            const cantidad = parseInt(item.cantidad) || 1;
            const subtotal = precioUnitario * cantidad;
            totalAcumulado += subtotal;

            const nombre = item.nombre || item.titulo || 'Producto';
            const talla = item.talla ? item.talla : 'Única';
            const color = item.color ? item.color : 'No especificado';

            mensaje += `• ${nombre} talla ${talla} (Color: ${color}, Cant: ${cantidad}) = $${subtotal.toLocaleString('es-CO')}\n`;
        });

        mensaje += `\n*TOTAL A PAGAR: $${totalAcumulado.toLocaleString('es-CO')}*`;
        mensaje += "\n\nQuedo atento a las indicaciones para realizar el pago. ¡Muchas gracias!";

        const mensajeUrl = encodeURIComponent(mensaje);
        const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensajeUrl}`;

        window.open(urlWhatsApp, '_blank');
    }

    window.onload = mostrarCarrito;
</script>

</body>
</html>
